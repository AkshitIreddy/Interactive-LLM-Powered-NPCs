syntax = "proto3";

package npc.mouth.worker.v1;

// Control-plane metadata only. Pixel payloads use the lease plane and are
// duplicated directly between authenticated broker and worker processes.
message TrackBinding {
  uint64 cancellation_generation = 1;
  uint64 actor_id = 2;
  uint64 track_id = 3;
  uint64 track_epoch = 4;
}

message FrameIdentity {
  uint64 sequence = 1;
  uint64 device_generation = 2;
  uint64 geometry_epoch = 3;
  sint64 captured_at_qpc_ns = 4;
}

message NormalizedRect {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}

message NormalizedLandmark {
  double x = 1;
  double y = 2;
  double confidence = 3;
}

// Packs adapt native landmark indices to these semantics. The compositor never
// depends on the pack name, model, or index layout.
message MouthLandmarks {
  uint32 schema_version = 1;
  fixed64 provider_instance_id = 2;
  NormalizedLandmark left_corner = 3;
  NormalizedLandmark right_corner = 4;
  NormalizedLandmark upper_lip_center = 5;
  NormalizedLandmark lower_lip_center = 6;
}

message SharedTextureLease {
  uint32 schema_version = 1;
  fixed64 lease_nonce_high = 2;
  fixed64 lease_nonce_low = 3;
  uint32 owner_process_id = 4;
  uint32 intended_consumer_process_id = 5;
  fixed64 native_handle_value = 6;
  fixed32 adapter_luid_low = 7;
  sfixed32 adapter_luid_high = 8;
  fixed64 keyed_mutex_acquire_key = 9;
  fixed64 keyed_mutex_release_key = 10;
  uint32 width = 11;
  uint32 height = 12;
  uint32 stride_bytes = 13;
  uint32 dxgi_format = 14;
  sint64 expires_at_qpc_ns = 15;
}

message TrackingEvidence {
  TrackBinding track = 1;
  FrameIdentity frame = 2;
  NormalizedRect face_bounds = 3;
  NormalizedRect mouth_bounds = 4;
  MouthLandmarks mouth_landmarks = 5;
  double yaw_degrees = 6;
  double pitch_degrees = 7;
  double roll_degrees = 8;
  double face_confidence = 9;
  double landmark_confidence = 10;
  double visibility_ratio = 11;
  bool mouth_occluded = 12;
  sint64 measured_at_qpc_ns = 13;
}

message AudioClockBinding {
  uint64 stream_generation = 1;
  uint64 segment_id = 2;
  uint64 first_sample_index = 3;
  uint32 sample_rate = 4;
  uint32 channels = 5;
  sint64 playback_at_qpc_ns = 6;
}

message MouthCoefficients {
  double jaw_open = 1;
  double lip_close = 2;
  double funnel = 3;
  double pucker = 4;
  double smile_left = 5;
  double smile_right = 6;
  double upper_lip_raise = 7;
  double lower_lip_depress = 8;
}

message RenderRequest {
  TrackBinding track = 1;
  FrameIdentity frame = 2;
  SharedTextureLease source = 3;
  TrackingEvidence tracking = 4;
  AudioClockBinding audio = 5;
  MouthCoefficients coefficients = 6;
  sint64 deadline_qpc_ns = 7;
}

message ResidualProposal {
  TrackBinding track = 1;
  FrameIdentity source_frame = 2;
  SharedTextureLease residual = 3;
  NormalizedRect normalized_bounds = 4;
  sint64 produced_at_qpc_ns = 5;
}
