[workspace]
resolver = "2"
members = ["crates/*", "apps/runtime-host"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/AkshitIreddy/Interactive-LLM-Powered-NPCs"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
print_stderr = "warn"
print_stdout = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.bench]
debug = true
