[package]
name = "interactive-npcs-game-discovery"
version = "2.0.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Deterministic Steam, Epic, GOG, and manual game installation discovery"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3.14"
