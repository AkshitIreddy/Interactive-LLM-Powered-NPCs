[package]
name = "npc-character-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Game-scoped character profile, encounter, prompt, and legacy-import orchestration"
publish = false

[lints]
workspace = true

[dependencies]
npc-game-profile = { path = "../game-profile" }
npc-memory = { path = "../memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v5"] }

[dev-dependencies]
tempfile = "3"

