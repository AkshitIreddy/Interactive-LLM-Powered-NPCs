[package]
name = "npc-runtime-core"
version = "2.0.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Async turn supervision and provider contracts for Interactive LLM Powered NPCs"

[dependencies]
async-trait = "0.1.83"
futures-core = "0.3.31"
futures-util = "0.3.31"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.12", features = ["rt"] }
tracing = "0.1.41"

[dev-dependencies]
proptest = "1.6.0"

[lints.rust]
unsafe_code = "forbid"
