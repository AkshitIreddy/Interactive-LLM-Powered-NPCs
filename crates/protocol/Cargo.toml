[package]
name = "npc-protocol"
version = "2.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Versioned wire and data contracts for Interactive LLM Powered NPCs"
publish = false

[features]
default = []

[dependencies]
prost = "0.13.4"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
thiserror = "2.0.11"
uuid = { version = "1.12.1", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1.6.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
