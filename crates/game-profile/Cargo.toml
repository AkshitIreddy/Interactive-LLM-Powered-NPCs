[package]
name = "npc-game-profile"
version = "2.0.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Versioned, declarative game profile contracts for Interactive LLM Powered NPCs"
publish = false

[lints]
workspace = true

[dependencies]
jsonschema = { version = "0.29.0", default-features = false }
regex = "1.11.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"

[dev-dependencies]
pretty_assertions = "1.4.1"
