[package]
name = "npc-providers-stt"
version = "2.0.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Hosted streaming speech-to-text adapters for Interactive LLM Powered NPCs"
publish = false

[dependencies]
async-trait = "0.1.83"
base64 = "0.22.1"
futures-util = "0.3.31"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
rustls = { version = "0.23.23", default-features = false, features = ["ring", "std"] }
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.12", features = ["rt"] }
url = "2.5.4"
zeroize = "1.8.1"

[dev-dependencies]
sha2 = "0.10.8"

[lints.rust]
unsafe_code = "forbid"
