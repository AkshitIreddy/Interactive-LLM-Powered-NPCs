[package]
name = "npc-providers-stt"
version = "2.0.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Hosted streaming speech-to-text adapters for Interactive LLM Powered NPCs"
publish = false

[dependencies]
async-trait = "0.1.83"
base64 = "0.22.1"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.12", features = ["rt"] }
zeroize = "1.8.1"

[lints.rust]
unsafe_code = "forbid"
