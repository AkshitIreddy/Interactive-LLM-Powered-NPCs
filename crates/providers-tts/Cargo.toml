[package]
name = "npc-providers-tts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Streaming hosted TTS contracts and adapters for Interactive LLM Powered NPCs"
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
