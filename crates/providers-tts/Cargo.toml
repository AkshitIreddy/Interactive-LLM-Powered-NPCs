[package]
name = "npc-providers-tts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Streaming hosted TTS contracts and adapters for Interactive LLM Powered NPCs"
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync"] }
