[package]
name = "npc-providers-tts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Streaming hosted TTS contracts and adapters for Interactive LLM Powered NPCs"
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
prost = "0.13.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tonic = { version = "0.12.3", features = ["tls-webpki-roots"] }
url = "2"
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
protoc-bin-vendored = "3.1.0"
tonic-build = "0.12.3"
