[package]
name = "npc-providers-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Capability-aware hosted LLM adapters with normalized streaming events"
publish = false

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
futures-core = "0.3.31"
futures-util = "0.3.31"
npc-runtime-core = { path = "../runtime-core" }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
url = "2.5.7"
zeroize = "1.8.1"

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints]
workspace = true
