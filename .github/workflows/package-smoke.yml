name: Local Windows package smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 20.20.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'

      - name: Use uv for optional worker fixtures
        if: ${{ hashFiles('pyproject.toml') != '' }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Restore pinned toolchains
        shell: pwsh
        run: |
          corepack enable
          corepack install
          rustup show

      - name: Restore workspaces
        shell: pwsh
        run: ./scripts/dev.ps1 setup

      - name: Run strict offline supply-chain checks
        shell: pwsh
        run: |
          ./scripts/security/scan-secrets.ps1 -IncludeUntracked
          ./scripts/security/check-licenses.ps1 -Strict
          ./scripts/security/generate-sbom.ps1 -Strict -OutputDirectory artifacts/preflight-sbom
          python -m unittest discover -s scripts/security/tests -v

      - name: Build local NSIS review artifact
        shell: pwsh
        run: ./scripts/dev.ps1 package -Configuration Debug -OutputDirectory artifacts/package-smoke

      - name: Assert local-only package manifest
        shell: pwsh
        run: |
          $manifestPath = Get-ChildItem artifacts/package-smoke -Filter package-manifest.json -Recurse | Select-Object -First 1
          if ($null -eq $manifestPath) { throw 'Package manifest was not generated.' }
          $manifest = Get-Content $manifestPath.FullName -Raw | ConvertFrom-Json
          if ($manifest.configuration -ne 'Debug' -or $manifest.distribution -ne 'local-review-only' -or $manifest.updater_enabled -ne $false -or $manifest.unsigned -ne $true) {
            throw 'Package escaped the local-review-only policy.'
          }
          if ($manifest.security_gates.skipped -ne $false -or $manifest.security_gates.deterministic_complete_sbom -ne $true -or $manifest.security_gates.reachable_history_secret_scan -ne $true) {
            throw 'Package manifest does not prove strict supply-chain prechecks.'
          }
          if ([string]::IsNullOrWhiteSpace($manifest.source.head_commit) -or [string]::IsNullOrWhiteSpace($manifest.source.source_candidate_digest.sha256)) {
            throw 'Package manifest is missing source identity evidence.'
          }

      - name: Install, inspect, doctor, launch, and uninstall in isolation
        shell: pwsh
        run: |
          $manifestPath = Get-ChildItem artifacts/package-smoke -Filter package-manifest.json -Recurse | Select-Object -First 1
          ./scripts/installer-smoke.ps1 `
            -PackageManifestPath $manifestPath.FullName `
            -AcknowledgeLocalInstall `
            -Confirm:$false `
            -ResultPath artifacts/installer-smoke-result.json

      - name: Publication remains disabled
        shell: pwsh
        run: |
          $result = Get-Content artifacts/installer-smoke-result.json -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed' -or $result.no_remaining_processes -ne $true -or $result.no_install_files -ne $true -or $result.no_shortcuts -ne $true -or $result.no_registry_entries -ne $true) {
            throw 'Installer smoke result did not prove clean uninstallation.'
          }
          Write-Host 'Installer was built and smoke-tested only inside this ephemeral runner.'
          Write-Host 'No artifact upload, release, tag, signing, or updater step is configured.'
